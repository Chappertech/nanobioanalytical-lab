name: Update Publications

on:
  # Run automatically every Monday
  schedule:
    - cron: "0 2 * * 1"

  # Also allow us to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update publications from OpenAlex
        run: python update_publications.py

      - name: Save updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git diff --cached --quiet || git commit -m "Automatically update publications"
          git push
